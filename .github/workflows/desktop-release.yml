name: Desktop release

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm install --global npm@10.9.4
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json'));
          if (process.env.RELEASE_TAG !== `v${pkg.version}` || pkg.version !== tauri.version) {
            throw new Error('Tag, package and Tauri versions must match');
          }
          JS

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            bundle: dmg
          - runner: windows-latest
            bundle: msi
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm install --global npm@10.9.4
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: npm ci
      - name: Build native installer
        env:
          TOKEN_PLANET_SUPABASE_URL: ${{ vars.TOKEN_PLANET_SUPABASE_URL }}
          TOKEN_PLANET_SUPABASE_PUBLISHABLE_KEY: ${{ vars.TOKEN_PLANET_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module <<'JS'
          const url = new URL(process.env.TOKEN_PLANET_SUPABASE_URL);
          if (url.protocol !== 'https:' || !process.env.TOKEN_PLANET_SUPABASE_PUBLISHABLE_KEY?.trim()) {
            throw new Error('HTTPS Supabase URL and publishable key are required');
          }
          JS
          npm run tauri -- build --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: token-planet-${{ matrix.bundle }}
          path: apps/desktop/src-tauri/target/release/bundle/${{ matrix.bundle }}/*.${{ matrix.bundle }}
          if-no-files-found: error

  release:
    needs: [validate, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: token-planet-*
          path: installers
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" installers/*.dmg installers/*.msi --draft --verify-tag --generate-notes
