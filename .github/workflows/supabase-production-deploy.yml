name: Supabase production deploy

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: Apply pending migrations to production
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master' && inputs.confirm_apply == true
    runs-on: ubuntu-latest
    environment: supabase-production
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.TOKEN_PLANET_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.TOKEN_PLANET_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.TOKEN_PLANET_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.119.0
      - name: Check production configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Preview pending migrations
        run: supabase db push --dry-run
      - name: Apply pending migrations
        run: supabase db push
